# The product as it is meant to run: a web process, a queue worker that can be scaled, and
# the two stores they share.
#
# Everything here was verified by building and running it, which had never been done before:
# the api service named a Dockerfile that did not exist, the worker's could not build, the
# server bundle imported a pruned dev dependency, the client was built into a directory the
# server did not look in, and nothing applied the migrations. Each of those only appears in
# a real production start — none is reachable from the dev server, the tests or a typecheck.
#
# The four secrets come from a .env file next to this one (or the shell), and the stack refuses
# to start without them: the values it used to ship were public, and a stack tried out with
# them and then exposed kept them. Generate each with
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# and put them in .env as POSTGRES_PASSWORD, SESSION_SECRET, ENCRYPTION_KEY and
# AGENT_RELAY_SECRET. Use hex for POSTGRES_PASSWORD: it is also written into DATABASE_URL.
# Keep ENCRYPTION_KEY with the database backups: the stored secrets cannot be read without it.

services:
  redis:
    image: valkey/valkey:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Depended on with service_healthy below, so the app is not started against a store that
    # is listening but not ready.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see the top of docker-compose.yml)}
      - POSTGRES_DB=webflowmaster
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webflowmaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The test inbox: the applications under test send their mail to its SMTP port (1025), and a
  # "Wait for email" step reads it through its API (server/email-inbox.ts). Any address has a
  # mailbox, so a test signs up with a made-up one. The inbox is at http://localhost:8025.
  # It keeps mail in memory and has no password: for test environments, not for real mail.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_MAX_MESSAGES=5000

  # Runs once and exits. Without it the app starts against an empty database and dies on the
  # first query — which is what happened: "relation system_settings does not exist", and
  # then a tenancy precondition failure, because the app_user role that migration 0004
  # creates was not there either.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # node, not `npm run db:migrate`: that script runs tsx, a dev dependency the image
    # prunes, so it exited 127 — `tsx: not found`. The migrator is bundled like the two
    # server entry points, and run the same way.
    command: ["node", "dist/apply-migrations.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/webflowmaster
      # Required by server/crypto.ts at import time, even though migrating encrypts nothing.      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see the top of docker-compose.yml)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/webflowmaster
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env (see the top of docker-compose.yml)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see the top of docker-compose.yml)}
      # Signs the tickets with which a worker borrows a local agent's browser; the worker must
      # hold the same value.
      - AGENT_RELAY_SECRET=${AGENT_RELAY_SECRET:?set AGENT_RELAY_SECRET in .env (see the top of docker-compose.yml)}
      # The fallback {{baseUrl}} for a run with no environment selected.
      - APP_BASE_URL=http://localhost:7000
      # Where report links in notifications, issues and commit statuses point: this stack as
      # its users reach it. Needed by the worker too, which is what sends them.
      - WEBFLOW_PUBLIC_URL=http://localhost:5000
      # This stack serves plain HTTP on localhost, so a Secure cookie would be dropped by
      # the browser: /api/login would answer 200 and every request after it would be
      # anonymous, with nothing saying why. Put TLS in front of this and remove the line
      # before anyone else can reach it.
      - SESSION_COOKIE_SECURE=false
      # The test inbox for "Wait for email" steps when the environment names none (mailpit.url).
      - MAILPIT_URL=http://mailpit:8025
    # The run evidence and the visual baselines, on a volume both processes mount. The worker
    # writes them and the web process serves them (server/routes/artifacts.routes.ts): with each
    # container on its own disk every screenshot, video, trace and HAR link in the report
    # answered 404, and the files existed only inside the worker. ARTIFACT_STORE=s3 is the
    # alternative when workers run on other hosts.
    volumes:
      - results:/app/results
      - visual_baselines:/app/data/visual-baselines
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/webflowmaster
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see the top of docker-compose.yml)}
      - APP_BASE_URL=http://localhost:7000
      # Where report links in notifications, issues and commit statuses point: this stack as
      # its users reach it. Needed by the worker too, which is what sends them.
      - WEBFLOW_PUBLIC_URL=http://localhost:5000
      # Runs on local agents: the worker borrows their browsers through the relay in the web
      # process. Without these two it looked for the relay on its own localhost and signed with
      # a secret the web process did not share, so every run on an agent failed.
      - AGENT_RELAY_URL=http://api:5000
      - AGENT_RELAY_SECRET=${AGENT_RELAY_SECRET:?set AGENT_RELAY_SECRET in .env (see the top of docker-compose.yml)}
      # See the api service. Runs execute here, so this is the one the steps use.
      - MAILPIT_URL=http://mailpit:8025
    # The same two volumes as the web process: see there.
    volumes:
      - results:/app/results
      - visual_baselines:/app/data/visual-baselines
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Several of these are the point of splitting the worker out at all:
    #   docker compose up --scale worker=5

volumes:
  redis_data:
  pg_data:
  results:
  visual_baselines:

# Dependency update pull requests. Security updates are separate (repository settings) and are
# not limited by the schedules below.
#
# Minor and patch versions arrive grouped, once a week, in one PR per ecosystem; each major
# version arrives in a PR of its own, to be read and tested on its own (at most five open at a
# time). Express, React and BullMQ majors touch the runtime: plan them for a quarter, not a sprint.
#
# Left out on purpose, upgraded by hand:
#   - Playwright: pinned three times (package-lock.json, the FROM line of every Dockerfile and the
#     agent's compatibility, see the developer guide); a PR that moves only the npm package
#     breaks the images.
#   - lightningcss-*: listed in client/package.json to keep npm 11 from dropping them; they
#     follow the lightningcss Tailwind brings (server/tests/dependency-locks.test.ts).
#   - Docker base images: pinned by digest to the Playwright release above.
#   - mermaid majors: held back by the documentation's vitepress-plugin-mermaid (see below).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      - dependency-name: playwright
      - dependency-name: playwright-core
      - dependency-name: '@playwright/test'
      - dependency-name: 'lightningcss-*'
      # vitepress-plugin-mermaid 2.0.17 accepts mermaid 10 and 11 only: 12 stops npm ci with
      # ERESOLVE. Lift this when the plugin supports it.
      - dependency-name: mermaid
        update-types: [version-update:semver-major]
      # undici 8 changes fetch and the dispatcher API: the cleanup requests stop going out
      # (server/cleanup.test.ts) and the release gate expects the 6.x line (#551). Migrate by hand.
      - dependency-name: undici
        update-types: [version-update:semver-major]
      # @xmldom/xmldom 0.9 replaces the errorHandler object with a function: SAML and SOAP stop
      # compiling and answer 500 (#549). 0.8 patches still arrive. Migrate by hand.
      - dependency-name: '@xmldom/xmldom'
        update-types: [version-update:semver-minor, version-update:semver-major]
      # TypeScript 7 is the native compiler rewrite: every check failed on it (#554). Move the
      # build, tsc -b and the editor tooling by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Vite 8 swaps esbuild and Rollup for Rolldown and Oxc: the monacoDompurify plugin
      # (optimizeDeps.esbuildOptions, Rollup hooks), the root "vite" override that vitepress 1.x
      # inherits and the @replit plugins all need rework. @vitejs/plugin-react 6 needs Vite 8
      # (#609 failed the build on vite/internal); 5.x still accepts Vite 6 and keeps arriving.
      # Upgrade both by hand, through Vite 7 first.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>= 6']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # 0.x packages: their "minor" is a breaking change (semver), which Dependabot still files
        # as minor. In one group they broke everything at once (#336: monaco-editor's new exports
        # map failed the build, a PGlite minor timed out the BDD tests). Each arrives in a PR of
        # its own instead, to be read and tested on its own.
        exclude-patterns:
          - monaco-editor
          - '@electric-sql/*'
          - '@xmldom/xmldom'
          - esbuild
          - drizzle-zod
          - drizzle-kit
          - '@replit/*'
      # pglite-socket pins pglite and its extensions (pglite-age, ...) to exact versions: bumped
      # one at a time, each PR stops npm ci with ERESOLVE (#614, #616). They move together, in a
      # group of their own, still apart from the other packages.
      pglite:
        patterns: ['@electric-sql/*']

  - package-ecosystem: npm
    directory: /deployment/lighthouse
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      lighthouse:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main, so flakiness in the installation jobs surfaces without waiting for a pull
  # request to hit it. The `changes` job treats every event but pull_request as a code change, so
  # a scheduled run executes every job.
  schedule:
    - cron: '17 3 * * *'

# Least privilege for the token: a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # Secrets committed by mistake. The gitleaks binary is downloaded at a pinned version and
  # checked against its published SHA-256; .gitleaks.toml allows the public test fixtures.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  # A PR that touches only documentation or marketing material cannot change what the
  # installation jobs prove (restore drill, network policy, E2E on the real installation, RLS
  # on real Postgres, the resilience tool), and each of them costs minutes of setup. They run
  # when anything else changed, always on main, and on the nightly schedule.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(git diff --name-only "$BASE"...HEAD | grep -v -E '^(docs|marketing)/|\.md$' || true)
          echo "Changed outside docs: ${code:-none}"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  # A file over 5 MB stays in every clone once committed, even if a later commit deletes it:
  # check every blob the new commits introduce, not only the final tree (scripts/check-large-files.mjs).
  large-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Refuse files over 5 MB in the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A branch's first push has no previous commit, and a scheduled run has no event
          # commit at all: compare with the default branch instead.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=origin/main; fi
          node scripts/check-large-files.mjs "$BASE"

  resilience-tool:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:resilience
      # The benchmark's configuration guards (profile limits, refusal of shared or production
      # targets) run on every change; the load itself stays an authorized acceptance run.
      - run: npm run test:benchmark
      # The pilot's gate (P19): no vendor baseline, operator who did not write the product, every
      # incident reopens its audit ID, the decision stands apart from the build's approval.
      - run: npm run test:pilot

  # The Helm chart and the Prometheus alert rules ship to operators: render the chart, lint it,
  # check the rules with promtool, and run the parity tests against compose and the server.
  helm-prometheus:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - run: npm run test:helm
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          chart=deployment/helm/webflowmaster
          sets="--set secrets.sessionSecret=ci --set secrets.encryptionKey=ci --set secrets.agentRelaySecret=ci --set secrets.postgresPassword=ci --set postgresql.enabled=true --set redis.enabled=true"
          # shellcheck disable=SC2086
          helm lint "$chart" --strict $sets
          helm template wfm "$chart" $sets > /dev/null
      - name: Validate the Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/rules:ro" \
            prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 \
            check rules /rules/prometheus-alerts.yml

  application-restore-drill:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:restore-drill
      - name: Prove isolated application recovery
        run: npm run backup:drill
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: application-restore-evidence
          path: |
            .local/restore-drill/*/recovery.json
            .local/restore-drill/*/operations.log
            .local/restore-drill/*/*-report.png
            .local/restore-drill/*/*-evidence.json
          if-no-files-found: warn
          retention-days: 7

  # Static checks, unit suites, the acceptance catalog and the build used to run one after the
  # other in a single job, so a PR waited for all of them in sequence. They share nothing but
  # `npm ci`, so each now runs in its own job and the slowest one sets the feedback time.
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (root + client workspace)
        run: npm ci

      - name: Release packaging and publication guards
        run: npm run test:release && npm run test:security

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # Explicit `any` per area may only go down: scripts/any-budget.json is the ceiling.
      - name: any budget
        run: npm run any-budget

      # Imports between server domains only go down a rank (scripts/server-domains.mjs); the
      # known violations in .dependency-cruiser-known-violations.json may only shrink.
      - name: Domain dependencies
        run: npm run deps:check

      # `npm run format` fixes what this reports. The whole tree was formatted in one commit,
      # listed in .git-blame-ignore-revs so `git blame` skips it.
      - name: Format check
        run: npm run format:check

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Each test file gets its own in-memory PGlite instance (server/tests/setup.ts), so there
      # is no shared database to point at. Note what this job therefore CANNOT prove: PGlite
      # connects as a superuser, and row-level security is inert under one. That is the
      # rls-on-real-postgres job below, not this one.
      DATABASE_URL: 'memory://'
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-session-secret
      # 32-byte hex key required by crypto.ts
      ENCRYPTION_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (root + client workspace)
        run: npm ci

      # Without this the whole point of the product goes untested here.
      #
      # `npm ci` does not bring the browsers: the `playwright` package has no install script
      # in this lockfile, so nothing downloaded them and every browser-driven test failed
      # with "Executable doesn't exist at ~/.cache/ms-playwright/chromium_headless_shell-…".
      # That was true from the first day this workflow existed — recorder-script.test.ts has
      # never run in CI — and stayed quiet while that was the only such file. It stopped
      # being quiet once element detection, the step executor, saved login states and frames
      # each grew a suite that drives a real browser: 28 failures, all the same cause.
      #
      # Chromium only, and deliberately: it is the one the tests launch. `firefox` and
      # `webkit` appear in the suite as *stored values* on a schedule row, never as a browser
      # anything opens, so downloading them would add minutes per run to prove nothing.
      - name: Resolve the Playwright version the lockfile pins
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on that version, because the browser build is tied to it — Playwright refuses
      # to launch a mismatched pair, which is the same trap the Dockerfile's image tag fell
      # into. A dependency bump misses the cache and downloads, which is correct.
      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      # Under a virtual display, because one suite drives a HEADED browser and a runner has
      # no X server: `startRecordingSession` sets `headless: false` on purpose — a recording
      # session is a window the tester watches and clicks in — so it died with "Missing X
      # server or $DISPLAY". Making it headless to suit CI would test something other than
      # what ships, so CI grows a display instead.
      #
      # The wrapper is harmless to everything else: a headless launch ignores DISPLAY. xvfb
      # itself arrives with `playwright install --with-deps`, which lists it among the tools
      # it installs on Ubuntu.
      # With coverage: below the thresholds in vitest.config.ts the step fails, so coverage
      # cannot slide unnoticed.
      - name: Server tests
        run: xvfb-run -a npm run test:coverage

      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs Server coverage/coverage-summary.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-server
          path: coverage/
          retention-days: 3
          if-no-files-found: ignore

  # Was missing: the client suite existed and CI never ran it.
  client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (root + client workspace)
        run: npm ci

      # With coverage: below the thresholds in client/vitest.config.ts the step fails.
      - name: Client tests
        run: npm run test:coverage --prefix client

      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs Client client/coverage/coverage-summary.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-client
          path: client/coverage/
          retention-days: 3
          if-no-files-found: ignore

  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (root + client workspace)
        run: npm ci
      - name: Resolve the Playwright version the lockfile pins
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collaudo application tests
        run: npm run test:collaudo

      - name: Verify acceptance catalog in Chromium
        run: npm run test:collaudo:browser

  # Production dependencies: no high or critical finding unless docs/SECURITY-AUDIT.md lists it
  # with an unexpired date (audit A-02). Root and the client workspace are checked separately.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (root)
        run: node scripts/security/audit-gate.mjs
      - name: npm audit (client)
        run: node scripts/security/audit-gate.mjs --client

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (root + client workspace)
        run: npm ci

      - name: Build all application deliverables
        run: npm run build

      # npm audit cannot see the dompurify copy Monaco vendors; this reads what the build shipped.
      - name: Require a patched dompurify in the client bundle
        run: node scripts/security/client-bundle-dompurify.mjs

      - name: Build documentation (including link checks)
        run: npm run docs:build

      # The installation tests start from these bundles as soon as the build is done, in
      # parallel with the unit suites; a failure in either still fails the workflow.
      - name: Pass the application bundles to the installation tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: application-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 1

  network-on-guarded-installation:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate destination policy
        run: npm run test:network:unit
      - name: Bundle production transports for the guarded namespaces
        run: npm run build:network-probe
      - name: Verify real firewalls, proxy policy and all three browser engines
        env:
          WFM_SAAS_TRANSPORT_BUNDLE: ${{ github.workspace }}/.local/tmp/saas-transports.mjs
          WFM_SAAS_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: npm run test:network
      - name: Bootstrap actual API and worker images in the isolated deployment
        run: npm run test:network:production

  ui-on-real-installation:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Installing all three engines took 14 minutes in run 37676375604;
    # reserve enough time for the complete UI matrix and evidence upload.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6388:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wfm_e2e:wfm_e2e@127.0.0.1:5432/wfm_ci_e2e
      REDIS_URL: redis://127.0.0.1:6388
      SESSION_SECRET: ci-e2e-disposable-session-secret
      ENCRYPTION_KEY: 'c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1'
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: application-bundles
          path: dist/
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Create a disposable installation with a non-superuser application role
        env:
          PGPASSWORD: e2e-postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE wfm_e2e LOGIN PASSWORD 'wfm_e2e' CREATEROLE BYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE wfm_ci_e2e OWNER wfm_e2e;"
          node dist/apply-migrations.js
      - name: Run interface journeys against the production bundles and queue worker
        run: npm run test:e2e
      - name: Preserve E2E report, failure traces and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installation-e2e-evidence
          path: .local/e2e/
          if-no-files-found: warn
          retention-days: 7

  # The server-tests job runs on PGlite, which connects as `postgres` — a superuser. Row-level
  # security is SILENTLY INERT under a superuser: with ENABLE, FORCE and a correct policy in
  # place, a superuser still sees every organization's rows and can UPDATE across them, with no
  # error and no warning. And `SET LOCAL ROLE app_user`, which the whole tenancy design rests
  # on, trivially succeeds for a superuser whether or not the membership grant exists.
  #
  # So that job cannot tell a working isolation boundary from an absent one. This job can:
  # a real Postgres, reached as a role that is not a superuser, which is what production looks
  # like. It is the only place the feature is actually proved.
  rls-on-real-postgres:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # CREATEROLE but NOT superuser: migration 0003 creates the app_user role and 0005 grants
      # membership in it, both of which a CREATEROLE owner can do. Needing superuser here would
      # itself be a finding.
      DATABASE_URL: postgresql://wfm_app:wfm_app@localhost:5432/webflowmaster
      SESSION_SECRET: ci-test-session-secret
      ENCRYPTION_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # BYPASSRLS is load-bearing and not optional. FORCE ROW LEVEL SECURITY subjects the table
      # OWNER to the policies, and this role owns the tables — so without it the handful of
      # deliberate privileged bootstraps (the queue worker learning which organization a job is
      # for, emitExecutionLog writing a log row, the audit entry written as an invitation is
      # accepted) would all be filtered to nothing, with no organization bound. app_user must
      # NOT have it, which is what makes SET LOCAL ROLE app_user meaningful.
      #
      # Granting BYPASSRLS needs superuser, so a migration cannot grant it to itself: it is a
      # deployment prerequisite. See the startup check in server/platform/db.ts, which refuses to boot
      # rather than discovering this on the first request.
      - name: Create the non-superuser application role and its database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE wfm_app LOGIN PASSWORD 'wfm_app' CREATEROLE BYPASSRLS;"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE webflowmaster OWNER wfm_app;"

      # Without this the job could silently degrade into the same blind spot it exists to
      # cover: connect as a superuser by accident and every assertion below passes for the
      # wrong reason.
      - name: Refuse to continue if the connection role is a superuser
        run: |
          is_super=$(psql "$DATABASE_URL" -tAc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user;")
          echo "current_user rolsuper = $is_super"
          test "$is_super" = "f"

      - name: Apply migrations as that role
        run: npm run test:migrate

      # Proves 0005 did its job. SET ROLE requires membership or superuser, so on a real
      # Postgres a missing grant means every tenant-scoped query fails on its first statement —
      # in production, on every request. No test on PGlite can catch that.
      - name: Confirm SET ROLE app_user works without superuser
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "BEGIN; SET LOCAL ROLE app_user; SELECT current_user; COMMIT;"

      # The other half: app_user must not be able to opt out of the policies it exists to be
      # bound by. If this ever becomes true, RLS is inert again and nothing else would say so.
      - name: Confirm app_user cannot bypass RLS
        run: |
          bypasses=$(psql "$DATABASE_URL" -tAc "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'app_user';")
          echo "app_user rolbypassrls = $bypasses"
          test "$bypasses" = "f"

      # test:rls chains every real-Postgres suite, test:rls:execution included (run units,
      # attempts and healing proposals across tenants and restricted projects, and two workers
      # racing for one unit). A new file joins the job only through a selector in package.json.
      - name: Isolation, tenancy and audit suites against real Postgres
        run: npm run test:rls

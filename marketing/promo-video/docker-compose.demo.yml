# The storefront the promo video tests, added to the collaudo stack:
#
#   docker compose -p wfm-collaudo -f docker-compose.yml -f collaudo/docker-compose.collaudo.yml \
#     -f marketing/promo-video/docker-compose.demo.yml up -d shop
#
# Served inside the stack as http://shop.northwind.test, where the api (loading the page in the
# builder) and the worker (running the plans) reach it. A demo must not depend on a public
# practice site being up on the day it is filmed.
services:
  shop:
    image: nginx:1.27-alpine
    volumes:
      - ./marketing/promo-video/demo/shop:/usr/share/nginx/html:ro
    networks:
      default:
        aliases:
          - shop.northwind.test

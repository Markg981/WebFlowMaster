<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Catalog · Northwind Shop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="brand">Northwind <span>Shop</span></div><nav><a href="/catalog/">Catalog</a><a href="/checkout/">Cart</a><a href="/login/">Account</a></nav></header>
  <main>
    <div class="promo" id="promo">Free shipping on orders over €50</div>
    <h1>Coffee</h1>
    <p class="lead">Small-batch roasts, shipped the week they are roasted.</p>
    <div class="grid">
      <div class="card product"><div class="img"></div><h3>Espresso Roast</h3><div class="price">€15.90</div></div>
      <div class="card product"><div class="img"></div><h3>Ethiopia Yirgacheffe</h3><div class="price">€17.50</div></div>
      <div class="card product"><div class="img"></div><h3>Decaf Colombia</h3><div class="price">€14.20</div></div>
    </div>
  </main>
</body>
</html>

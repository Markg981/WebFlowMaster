# ─── WebFlowMaster Observability Stack ─────────────────────────────────────────
#
# Grafana Loki for log aggregation + Grafana for dashboards and querying.
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Then:
#   - Grafana UI:  http://localhost:3001  (user admin, password GRAFANA_ADMIN_PASSWORD)
#   - Loki API:    http://localhost:3100
#
# In your .env file, set:
#   GRAFANA_ADMIN_PASSWORD=<a strong password>   # required: the stack refuses to start without it
#   LOKI_URL=http://localhost:3100
#
# Images are pinned. Loki stays on the 2.9 line: observability/loki-config.yml enables retention in
# the compactor, and Loki 3.x refuses that without a `delete_request_store`, which 2.9 does not
# need. Moving to 3.x means adding it (and reading the 3.0 upgrade notes) in the same change.
#
# ───────────────────────────────────────────────────────────────────────────────

services:
  # ─── Grafana Loki ─────────────────────────────────────────────────────────
  # Lightweight log aggregation system. Unlike Elasticsearch, Loki only
  # indexes labels (not full-text), making it very memory-efficient (~256MB).
  loki:
    image: grafana/loki:2.9.17
    container_name: wfm-loki
    ports:
      - '3100:3100'
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Grafana ──────────────────────────────────────────────────────────────
  # Visualization and dashboards. Pre-configured with Loki as a datasource.
  grafana:
    image: grafana/grafana:11.6.16
    container_name: wfm-grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see the top of docker-compose.observability.yml)}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:

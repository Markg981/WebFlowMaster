# The collaudo stack: the product as docker-compose.yml runs it, plus what the manual test
# protocol needs around it. Always started together with the base file and under its own
# project name, so its data never mixes with a development stack:
#
#   docker compose -p wfm-collaudo -f docker-compose.yml -f collaudo/docker-compose.collaudo.yml up -d --build
#
# What it adds (collaudo/README.md has the whole procedure):
#   caddy       HTTPS in front of the app and of Keycloak, with its own certificate authority:
#               https://wfm.collaudo.test and https://keycloak.collaudo.test. Production mode
#               needs it: the session cookie is Secure, and an OpenID issuer must be https.
#   ca-export   copies Caddy's root certificate where the app, the worker and the agent read it.
#   keycloak    the identity provider for the single sign-on cases, realm "acme" imported.
#   intranet    an application on a private network only the local agent can reach.
#   ricevitore  receives notification webhooks and prints them: docker compose logs ricevitore.
#   mailpit     (from the base file) the test inbox; Keycloak mails its password resets there
#               (WEB-45). The inbox is at http://localhost:8025.
#   display     a screen for the recording window, in the browser at http://localhost:6080.
#   agente      the local agent (profile "agente"), started once its token exists.
#   agente-diverso  an agent on another Playwright version (profile "agente-diverso", AGT-05).
#
# Relative paths resolve from the repository root, the directory of the first -f file.
#
# Values here are for a test installation only: never reuse them anywhere else.

x-collaudo-app-env: &collaudo-app-env
  NODE_EXTRA_CA_CERTS: /collaudo-ca/root.crt
  AGENT_RELAY_SECRET: collaudo-relay-secret-not-for-production
  APP_BASE_URL: https://the-internet.herokuapp.com
  # Where the report links in notifications (PLN-13), issues (PLN-14) and commit statuses
  # point. On the worker too: that is where those are sent from, and set only on the web
  # process every notification and issue went out without a link to its report.
  WEBFLOW_PUBLIC_URL: https://wfm.collaudo.test
  # Empty means the product's default; cases PLN-11 and PLN-15 set them for a while.
  ORG_MAX_CONCURRENT_RUNS: ${ORG_MAX_CONCURRENT_RUNS:-}
  ORG_MAX_QUEUED_RUNS: ${ORG_MAX_QUEUED_RUNS:-}
  RUN_MAX_DURATION_MS: ${RUN_MAX_DURATION_MS:-}
  # Both processes ship their logs to the stack's Loki (OPS-09).
  LOKI_URL: http://loki:3100
  # The AI cases (REP-15…22): GEMINI_API_KEY=finto GEMINI_BASE_URL=http://simulatori:8080/gemini.
  # Empty by default, so the cases that check the product without a key (WEB-10) still can.
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
  # WEB-43: how long a paused debug session waits; the product's 15 minutes when empty.
  DEBUG_IDLE_TIMEOUT_MS: ${DEBUG_IDLE_TIMEOUT_MS:-}

services:
  postgres:
    # A DBA reaches it on 55432 for the backup and audit-log cases, without clashing with a
    # development database on 5432.
    ports: !override ["55432:5432"]

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      <<: *collaudo-app-env
      SESSION_COOKIE_SECURE: "true"
      SESSION_SECRET: collaudo-session-secret-not-for-production-0001
      REGISTRATION: ${REGISTRATION:-invitation}
      INSTALLATION_ADMINS: ${INSTALLATION_ADMINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      WEBHOOK_RATE_LIMIT: ${WEBHOOK_RATE_LIMIT:-120}
      # Sign-in attempts per address in 15 minutes. 20 is the product's value and what ACC-07
      # checks; an automated cycle raises it, or a run of logins fails cases for no fault.
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      # The screen the recording window opens on (WEB-11, ENV-04). Without a DISPLAY a Linux
      # server cannot record, and says so.
      DISPLAY: display:0
    volumes:
      - collaudo_ca:/collaudo-ca:ro
      - ./collaudo:/collaudo:ro
    depends_on:
      ca-export:
        condition: service_completed_successfully
      display:
        condition: service_started

  worker:
    # The browsers of a run trust the collaudo CA too (WEB-48 signs in on Keycloak): collaudo/worker.
    entrypoint: ["sh", "/collaudo-worker/trust-ca.sh"]
    command: ["node", "dist/worker.js"]
    environment:
      <<: *collaudo-app-env
      # Where runs borrowing an agent's browser reach the relay in the web process.
      AGENT_RELAY_URL: http://api:5000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - collaudo_ca:/collaudo-ca:ro
      - ./collaudo/worker:/collaudo-worker:ro
    depends_on:
      ca-export:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./collaudo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      default:
        # Inside the stack these names reach Caddy, as they do from the tester's browser.
        aliases:
          - wfm.collaudo.test
          - keycloak.collaudo.test
    healthcheck:
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 30

  ca-export:
    image: alpine:3.20
    command: ["sh", "-c", "cp /caddy-data/caddy/pki/authorities/local/root.crt /collaudo-ca/root.crt && chmod 644 /collaudo-ca/root.crt"]
    volumes:
      - caddy_data:/caddy-data:ro
      - collaudo_ca:/collaudo-ca
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://keycloak.collaudo.test
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./collaudo/keycloak:/opt/keycloak/data/import:ro

  intranet:
    image: nginx:1.27-alpine
    volumes:
      - ./collaudo/intranet:/usr/share/nginx/html:ro
    networks:
      privata:
        aliases:
          - intranet.acme.local

  ricevitore:
    image: mendhak/http-https-echo:35
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"

  display:
    build:
      context: ./collaudo/display
    ports:
      # The loopback only: the screen has no password.
      - "127.0.0.1:6080:6080"
    # start-display exits when Xvfb does not come up; this brings it back.
    restart: unless-stopped

  # TestRail, Jira, Xray, Zephyr Scale, Azure DevOps, GitHub, GitLab and Gemini, simulated
  # (collaudo/simulatori): the TMG, TRC, INT-07 and AI cases run without accounts. What they received is at
  # http://localhost:8090; inside the stack the services are http://simulatori:8080/<name>.
  simulatori:
    image: node:22-alpine
    command: ["node", "/simulatori/server.mjs"]
    environment:
      SIMULATORI_PUBLIC_URL: http://localhost:8090
    volumes:
      - ./collaudo/simulatori:/simulatori:ro
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/_admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # INT-08: Jenkins running the shared library of integrations/jenkins (profile "jenkins",
  # started by npm run collaudo:jenkins, which also makes its API key). http://localhost:8088,
  # admin / Collaudo.2026!.
  jenkins:
    profiles: ["jenkins"]
    build:
      context: ./collaudo/jenkins
    environment:
      WFM_URL: https://wfm.collaudo.test
      WFM_API_KEY: ${WFM_JENKINS_API_KEY:-}
      WFM_PLAN: ${WFM_JENKINS_PLAN:-}
      WFM_ENVIRONMENT: ${WFM_JENKINS_ENVIRONMENT:-}
      NODE_EXTRA_CA_CERTS: /collaudo-ca/root.crt
    volumes:
      - collaudo_ca:/collaudo-ca:ro
      - .:/wfm-repo:ro
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      ca-export:
        condition: service_completed_successfully

  # OPS-09: the application's logs, queried from Grafana at http://localhost:13001 (admin / admin).
  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:13100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "127.0.0.1:13001:3000"
    depends_on:
      loki:
        condition: service_healthy

  agente:
    profiles: ["agente"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      WFM_URL: https://wfm.collaudo.test
      WFM_AGENT_TOKEN: ${WFM_AGENT_TOKEN:-}
      NODE_EXTRA_CA_CERTS: /collaudo-ca/root.crt
    volumes:
      - collaudo_ca:/collaudo-ca:ro
    networks:
      - default
      - privata
    depends_on:
      ca-export:
        condition: service_completed_successfully
    restart: unless-stopped

  # AGT-05: an agent on another Playwright minor, which the server must refuse to use. Created in
  # Settings → Local agents like the other, in a pool of its own, with its own token.
  agente-diverso:
    profiles: ["agente-diverso"]
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        PLAYWRIGHT_VERSION: ${AGENT_PLAYWRIGHT_VERSION:-1.60.0}
    environment:
      WFM_URL: https://wfm.collaudo.test
      WFM_AGENT_TOKEN: ${WFM_AGENT_TOKEN_DIVERSO:-}
      NODE_EXTRA_CA_CERTS: /collaudo-ca/root.crt
    volumes:
      - collaudo_ca:/collaudo-ca:ro
    depends_on:
      ca-export:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  # Only the intranet and the agent: the app and the worker cannot reach it, which is the point.
  privata:
    internal: true

volumes:
  caddy_data:
  collaudo_ca:
  loki_data:

# Disposable stores for the production-bundle UI suite. No Collaudo services or volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: e2e-postgres
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6388:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

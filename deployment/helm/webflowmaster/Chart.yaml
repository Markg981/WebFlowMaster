apiVersion: v2
name: webflowmaster
description: >-
  WebFlowMaster on Kubernetes: the web process (api), the queue workers, the migration job that
  runs before each install and upgrade, and optional evaluation-only PostgreSQL and Redis.
type: application
# The chart's own version. Bump it on every change to the templates or the default values.
version: 0.1.0
# The application version the image tags default to (image.tag overrides it).
appVersion: '1.3.0'
kubeVersion: '>=1.25.0-0'
keywords:
  - testing
  - playwright
  - qa
annotations:
  # No cluster was used to validate this chart: scripts/helm-chart.test.mjs checks it statically.
  webflowmaster.io/validation: static

{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "webflowmaster.fullname" . }}-api
  labels:
    {{- include "webflowmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "webflowmaster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
{{- if .Values.worker.podDisruptionBudget.enabled }}
---
# Evictions still respect terminationGracePeriodSeconds, so a drained node waits for the runs;
# the budget keeps a node pool upgrade from draining every worker at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "webflowmaster.fullname" . }}-worker
  labels:
    {{- include "webflowmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  maxUnavailable: {{ .Values.worker.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "webflowmaster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}

{{- if not .Values.secrets.existingSecret }}
# The five secrets docker-compose.yml refuses to start without, plus the optional ones. Skipped
# entirely when secrets.existingSecret names a Secret you manage (sealed-secrets, external
# secrets operator, ...), which must carry the same keys.
#
# Rendered as a pre-install/pre-upgrade hook so it exists before the migration Job, which is
# itself a hook and runs before the release's ordinary resources. Hook resources are not
# removed by `helm uninstall`: delete it by hand afterwards if the namespace lives on.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webflowmaster.fullname" . }}-secrets
  labels:
    {{- include "webflowmaster.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required with postgresql.enabled" .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username .Values.secrets.postgresPassword (include "webflowmaster.fullname" .) .Values.postgresql.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or enable the evaluation postgresql)" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "webflowmaster.fullname" .) | quote }}
  {{- else }}
  REDIS_URL: {{ required "secrets.redisUrl is required (or enable the evaluation redis)" .Values.secrets.redisUrl | quote }}
  {{- end }}
  SESSION_SECRET: {{ required "secrets.sessionSecret is required" .Values.secrets.sessionSecret | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  AGENT_RELAY_SECRET: {{ required "secrets.agentRelaySecret is required" .Values.secrets.agentRelaySecret | quote }}
  {{- if .Values.metrics.enabled }}
  WFM_METRICS_TOKEN: {{ required "secrets.metricsToken is required with metrics.enabled" .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.migrationDatabaseUrl }}
  MIGRATION_DATABASE_URL: {{ .Values.secrets.migrationDatabaseUrl | quote }}
  {{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webflowmaster.serviceAccountName" . }}
  labels:
    {{- include "webflowmaster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pods call no Kubernetes API.
automountServiceAccountToken: false
{{- end }}

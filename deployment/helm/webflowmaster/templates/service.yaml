apiVersion: v1
kind: Service
metadata:
  name: {{ include "webflowmaster.fullname" . }}-api
  labels:
    {{- include "webflowmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "webflowmaster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.apiPort }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- if .Values.metrics.enabled }}
---
# Headless: one endpoint per worker pod, so Prometheus scrapes every replica and the queue
# depth gauge can be taken as a max across them (observability/prometheus-alerts.yml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webflowmaster.fullname" . }}-worker-metrics
  labels:
    {{- include "webflowmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "webflowmaster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: {{ .Values.metrics.workerPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}

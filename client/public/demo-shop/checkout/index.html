<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout · Northwind Shop</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <div class="brand">Northwind <span>Shop</span></div>
      <nav>
        <a href="../catalog/">Catalog</a><a href="../checkout/">Cart</a
        ><a href="../login/">Account</a>
      </nav>
    </header>
    <main>
      <h1>Checkout</h1>
      <p class="lead">Two bags of espresso beans, roasted this week.</p>
      <div class="card">
        <div class="row"><span>Espresso Roast · 2 × 500 g</span><span>€31.80</span></div>
        <div class="row"><span>Shipping</span><span id="shipping-cost">€4.90</span></div>
        <label for="shipping">Shipping method</label>
        <select id="shipping" name="shipping">
          <option value="standard">Standard (3–5 days)</option>
          <option value="express">Express (next day)</option>
          <option value="pickup">Pick up in store</option>
        </select>
        <button type="button" id="place-order">Place order</button>
        <div id="progress" class="spinner" hidden>Processing payment…</div>
        <div id="confirmation" hidden></div>
      </div>
    </main>
    <script src="../shop.js"></script>
  </body>
</html>
